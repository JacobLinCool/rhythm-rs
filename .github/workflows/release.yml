name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Bench smoke
        run: cargo test -p rhythm-mode-taiko --release bench_smoke_large_chart -- --ignored

  create_release:
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: "latest"
          title: "Dev Build"

  publish_crate:
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true

  release_assets:
    needs: [quality_gate, create_release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: "taiko-linux-amd64"
          - build: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: "taiko-darwin-amd64"
          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: "taiko-darwin-arm64"
          - build: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: "taiko-windows-amd64"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: matrix.os != 'windows-latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/taiko
          asset_name: ${{ matrix.artifact_name }}
          tag: latest

      - name: Upload to Release (Windows)
        uses: svenstaro/upload-release-action@v2
        if: matrix.os == 'windows-latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/taiko.exe
          asset_name: ${{ matrix.artifact_name }}.exe
          tag: latest
