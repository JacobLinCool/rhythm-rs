[package]
name = "taiko-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Bounded, fail-closed audio decoding shared by taiko clients and servers"

[dependencies]
kira = { version = "0.11.0", default-features = false }
symphonia = { version = "=0.5.5", default-features = false, features = [
    "flac",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror.workspace = true

[dev-dependencies]
sha2 = "0.10.9"
