[package]
name = "rhythm-importer-tja"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "TJA importer adapter from crates.io tja to rhythm-chart CanonicalChart"

[lib]
name = "rhythm_importer_tja"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
encoding_rs = "0.8.35"
rhythm-chart = { path = "../rhythm-chart", version = "0.1.0" }
tja = "=0.5.0"

[dev-dependencies]
serde_json = "1.0.140"
