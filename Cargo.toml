[workspace]
resolver = "2"
members = [
    "rhythm-core",
    "rhythm-chart",
    "rhythm-mode-taiko",
    "rhythm-mode-lane",
    "rhythm-mode-radial",
    "rhythm-importer-tja",
    "taiko-audio",
    "taiko-multiplayer-protocol",
    "taiko-resource-protocol",
    "taiko-resource-server",
    "taiko-game",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/JacobLinCool/rhythm-rs"
homepage = "https://github.com/JacobLinCool/rhythm-rs"
authors = ["JacobLinCool <jacob@csie.cool>"]

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"

[profile.release]
debug = true
