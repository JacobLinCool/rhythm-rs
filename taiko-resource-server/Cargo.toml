[package]
name = "taiko-resource-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HTTP resource server for taiko-game song libraries"

[[bin]]
name = "taiko-resource-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.6", features = ["ws"] }
clap = { version = "4.5.32", features = ["derive"] }
futures-util = "0.3.31"
hex = "0.4.3"
rayon = "1.11.0"
rhythm-importer-tja = { path = "../rhythm-importer-tja", version = "0.1.0" }
serde = { workspace = true }
serde_json = "1.0.140"
sha2 = "0.10.9"
taiko-multiplayer-protocol = { path = "../taiko-multiplayer-protocol", version = "0.1.0" }
taiko-resource-protocol = { path = "../taiko-resource-protocol", version = "0.1.0" }
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
walkdir = "2.5.0"

[dev-dependencies]
rhythm-mode-taiko = { path = "../rhythm-mode-taiko", version = "0.1.0" }
